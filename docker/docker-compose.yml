name: spendsync

services:
  # ── PostgreSQL 16 ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: spendsync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: spendsync_db
      POSTGRES_USER: spendsync
      POSTGRES_PASSWORD: spendsync_secret
    ports:
      - "5432:5432"
    volumes:
      - spendsync_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spendsync -d spendsync_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  spendsync_postgres_data:
