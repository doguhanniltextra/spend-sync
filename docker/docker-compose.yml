name: spendsync

services:
  # ── PostgreSQL 16 ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: spendsync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: spendsync_db
      POSTGRES_USER: spendsync
      POSTGRES_PASSWORD: spendsync_secret
    ports:
      - "5432:5432"
    volumes:
      - spendsync_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spendsync -d spendsync_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Apache Kafka (KRaft mode — no ZooKeeper) ─────────────────────────────────
  kafka:
    image: apache/kafka:3.7.0
    container_name: spendsync-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Kafdrop — Kafka Web UI ───────────────────────────────────────────────────
  kafdrop:
    image: obsidiandynamics/kafdrop:4.0.1
    container_name: spendsync-kafdrop
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BROKERCONNECT: kafka:9092
      JVM_OPTS: "-Xms32M -Xmx64M"
    ports:
      - "9000:9000"

volumes:
  spendsync_postgres_data:
