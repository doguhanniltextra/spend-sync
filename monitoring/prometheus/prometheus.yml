global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 5s

scrape_configs:
  - job_name: "spendsync-backend"
    metrics_path: "/actuator/prometheus"
    scrape_interval: 15s
    scrape_timeout: 5s
    static_configs:
      # AWS ECS Service Connect alias (dns_name = backend)
      - targets: ["backend:8080"]
        labels:
          application: "spendsync"
          environment: "dev"
