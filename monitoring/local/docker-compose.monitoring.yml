version: "3.8"

services:
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: spendsync-prometheus-local
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ../prometheus/prometheus.local.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-local-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:10.4.0
    container_name: spendsync-grafana-local
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-local-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  prometheus-local-data:
  grafana-local-data:
