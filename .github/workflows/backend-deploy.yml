name: Backend CI/CD & ECS Fargate Deployment

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Yayınlanacak Özel Git Commit SHA veya Tag (Boş bırakılırsa HEAD kullanılır)'
        required: false
        default: ''

concurrency:
  group: backend-deploy-dev
  cancel-in-progress: true

jobs:
  test:
    name: Backend Build & Unit Tests
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup OpenJDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'


      - name: Run Unit Tests
        run: mvn clean test -B -Dtest="!*ContainerTest"

  build-and-deploy:
    name: Build ARM64 Docker Image & Deploy to ECS Fargate
    needs: test
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.commit_sha || github.sha }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU (ARM64 Cross-Compilation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine Image Tag
        id: image-tag
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "tag=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Build and Push ARM64 Docker Image to ECR
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ steps.image-tag.outputs.tag }}
            ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:latest
          provenance: false

      - name: Download Active Task Definition from ECS & Clean Metadata
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ vars.CONTAINER_NAME }}-dev \
            --query taskDefinition > task-def-raw.json
          
          jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' task-def-raw.json > task-def.json

      - name: Render New ECS Task Definition with New Image Tag
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: backend/task-def.json
          container-name: ${{ vars.CONTAINER_NAME }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ steps.image-tag.outputs.tag }}

      - name: Deploy Task Definition to ECS Fargate Service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ vars.ECS_SERVICE }}
          cluster: ${{ vars.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Verify Live Application Health via ALB
        run: |
          echo "Verifying application health via Load Balancer..."
          ALB_URL="http://${{ vars.ALB_DNS_NAME }}/actuator/health"
          
          # Retry loop (max 6 attempts, 10 seconds interval)
          for i in {1..6}; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$ALB_URL" || true)
            if [ "$HTTP_STATUS" -eq 200 ]; then
              echo "✅ Health check PASSED! HTTP Status: 200 OK"
              exit 0
            fi
            echo "Attempt $i: Health check returned $HTTP_STATUS. Waiting 10s..."
            sleep 10
          done
          
          echo "❌ Health check FAILED! Application did not respond with 200 OK."
          exit 1
