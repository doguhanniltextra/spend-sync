name: Backend CI/CD & ECS Fargate Deployment

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*'
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Specific Git Commit SHA or Tag to deploy (defaults to HEAD if empty)'
        required: false
        default: ''

concurrency:
  group: backend-deploy-dev
  cancel-in-progress: true

jobs:
  test:
    name: Backend Build & Unit Tests
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup OpenJDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Run Unit Tests
        run: mvn clean test -B -Dtest="!*ContainerTest"

  build-and-deploy:
    name: Build ARM64 Docker Image & Deploy to ECS Fargate
    needs: test
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.commit_sha || github.sha }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU (ARM64 Cross-Compilation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup OpenJDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Application Package (Native Host Speed)
        run: mvn clean package -DskipTests -B

      - name: Determine Image Tag
        id: image-tag
        run: |
          if [ -n "${{ github.ref_name }}" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG=$(git rev-parse --short HEAD)
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Determined image tag: ${TAG}"

      - name: Build and Push ARM64 Docker Image to ECR
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ steps.image-tag.outputs.tag }}
            ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:latest
          provenance: false

      - name: Download Active Task Definition from ECS & Clean Metadata
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ vars.CONTAINER_NAME }}-dev \
            --query taskDefinition > task-def-raw.json
          
          jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' task-def-raw.json > task-def.json

      - name: Render New ECS Task Definition with New Image Tag
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: backend/task-def.json
          container-name: ${{ vars.CONTAINER_NAME }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ steps.image-tag.outputs.tag }}

      - name: Deploy Task Definition to ECS Fargate Service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ vars.ECS_SERVICE }}
          cluster: ${{ vars.ECS_CLUSTER }}
          wait-for-service-stability: false

      - name: Verify Live Application Health via ALB
        run: |
          echo "Verifying application health via Load Balancer..."
          ALB_URL="http://${{ vars.ALB_DNS_NAME }}/actuator/health"
          
          # Retry loop (max 10 attempts, 10 seconds interval)
          for i in {1..10}; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$ALB_URL" || true)
            if [ "$HTTP_STATUS" -eq 200 ]; then
              echo "✅ Health check PASSED! HTTP Status: 200 OK"
              break
            fi
            echo "Attempt $i: Health check returned $HTTP_STATUS. Waiting 10s..."
            sleep 10
            if [ $i -eq 10 ]; then
              echo "❌ Health check FAILED! Application did not respond with 200 OK."
              exit 1
            fi
          done

      - name: Automated Post-Deploy Smoke Test (API Verification)
        run: |
          echo "🚀 Running Post-Deploy Smoke Tests on live endpoints..."
          ALB_HOST="${{ vars.ALB_DNS_NAME }}"
          
          # 1. Login and get JWT token
          LOGIN_PAYLOAD='{"email":"cfo@spendsync.com","password":"Password123!"}'
          LOGIN_RESP=$(curl -s -w "\n%{http_code}" -X POST "http://${ALB_HOST}/api/v1/auth/login" \
            -H "Content-Type: application/json" \
            -d "${LOGIN_PAYLOAD}")
          
          HTTP_BODY=$(echo "$LOGIN_RESP" | sed '$d')
          HTTP_STATUS=$(echo "$LOGIN_RESP" | tail -n1)
          
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "❌ Smoke Test FAILED: Login endpoint returned HTTP ${HTTP_STATUS}"
            echo "Response: ${HTTP_BODY}"
            exit 1
          fi
          
          TOKEN=$(echo "$HTTP_BODY" | jq -r '.accessToken // empty')
          if [ -z "$TOKEN" ]; then
            echo "❌ Smoke Test FAILED: No accessToken found in login response"
            exit 1
          fi
          echo "✅ Authentication successful. JWT Bearer token obtained."
          
          # 2. Check Budget Summary endpoint
          BUDGET_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X GET "http://${ALB_HOST}/api/v1/budget/summary" \
            -H "Authorization: Bearer ${TOKEN}")
          
          if [ "$BUDGET_STATUS" -ne 200 ]; then
            echo "❌ Smoke Test FAILED: Budget summary endpoint returned HTTP ${BUDGET_STATUS}"
            exit 1
          fi
          echo "✅ Budget Summary API verified (HTTP 200 OK)."
          
          # 3. Check Intelligence Pulse endpoint
          PULSE_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X GET "http://${ALB_HOST}/api/v1/intelligence/pulse" \
            -H "Authorization: Bearer ${TOKEN}")
          
          if [ "$PULSE_STATUS" -ne 200 ]; then
            echo "❌ Smoke Test FAILED: Intelligence pulse endpoint returned HTTP ${PULSE_STATUS}"
            exit 1
          fi
          echo "✅ Intelligence Pulse API verified (HTTP 200 OK)."
          echo "🎉 All Post-Deploy Smoke Tests PASSED successfully!"
