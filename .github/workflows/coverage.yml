name: Backend Code Coverage Gate

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  coverage-gate:
    name: JaCoCo Coverage Threshold Check
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate JaCoCo Coverage Report
        shell: powershell
        working-directory: ./backend
        run: |
          mvn test -Dtest="!*ContainerTest"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Evaluate Coverage Metrics
        shell: powershell
        working-directory: ./backend
        run: |
          $csvPath = "target/site/jacoco/jacoco.csv"
          if (!(Test-Path $csvPath)) {
              Write-Error "JaCoCo coverage CSV report not found at $csvPath."
              exit 1
          }

          $csv = Import-Csv $csvPath
          $lineMissed = ($csv | Measure-Object -Property LINE_MISSED -Sum).Sum
          $lineCovered = ($csv | Measure-Object -Property LINE_COVERED -Sum).Sum
          $lineTotal = $lineMissed + $lineCovered

          $branchMissed = ($csv | Measure-Object -Property BRANCH_MISSED -Sum).Sum
          $branchCovered = ($csv | Measure-Object -Property BRANCH_COVERED -Sum).Sum
          $branchTotal = $branchMissed + $branchCovered

          $linePct = [math]::Round(($lineCovered / $lineTotal) * 100, 2)
          $branchPct = if ($branchTotal -gt 0) { [math]::Round(($branchCovered / $branchTotal) * 100, 2) } else { 100.0 }

          $threshold = 75.0

          Write-Host "=========================================="
          Write-Host "SpendSync JaCoCo Code Coverage Results"
          Write-Host "=========================================="
          Write-Host "Line Coverage   : $linePct% ($lineCovered / $lineTotal lines)"
          Write-Host "Branch Coverage : $branchPct% ($branchCovered / $branchTotal branches)"
          Write-Host "Required Target : $threshold%"
          Write-Host "=========================================="

          if ($linePct -lt $threshold) {
              Write-Error "Line coverage $linePct% is below required threshold of $threshold%."
              exit 1
          }

          Write-Host "Coverage gate passed successfully."
          exit 0
