name: Dynamic Backend Unit Tests

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  filter:
    name: Detect Changed Modules
    runs-on: self-hosted
    outputs:
      shared: ${{ steps.filter.outputs.shared }}
      modules: ${{ steps.filter.outputs.changes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for file changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared:
              - 'backend/pom.xml'
              - 'backend/src/main/java/com/enterprise/spendsync/shared/**'
              - 'backend/src/test/java/com/enterprise/spendsync/shared/**'
              - 'backend/src/test/java/com/enterprise/spendsync/architecture/**'
              - 'backend/src/main/java/com/enterprise/spendsync/core/**'
            vendorportal:
              - 'backend/src/**/vendorportal/**'
            purchasing:
              - 'backend/src/**/purchasing/**'
            requisition:
              - 'backend/src/**/requisition/**'
            budget:
              - 'backend/src/**/budget/**'
            matching:
              - 'backend/src/**/matching/**'
            payment:
              - 'backend/src/**/payment/**'
            receiving:
              - 'backend/src/**/receiving/**'
            catalog:
              - 'backend/src/**/catalog/**'
            intelligence:
              - 'backend/src/**/intelligence/**'
            analytics:
              - 'backend/src/**/analytics/**'
            audit:
              - 'backend/src/**/audit/**'
            notification:
              - 'backend/src/**/notification/**'

  test:
    name: Run Targeted Tests
    needs: filter
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Execute Targeted Tests
        shell: powershell
        working-directory: ./backend
        run: |
          $isManual = "${{ github.event_name }}" -eq "workflow_dispatch"
          $isShared = "${{ needs.filter.outputs.shared }}" -eq "true"
          
          if ($isManual -or $isShared) {
              Write-Host ">> Core/Shared changes detected. Running full unit test suite..." -ForegroundColor Cyan
              mvn test -Dtest="!*ContainerTest"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              exit 0
          }
          
          $changedModules = '${{ needs.filter.outputs.modules }}' | ConvertFrom-Json
          $testPatterns = @()
          
          foreach ($mod in $changedModules) {
              if ($mod -ne "shared") {
                  $testPatterns += "com.enterprise.spendsync.$mod.**"
              }
          }
          
          if ($testPatterns.Count -eq 0) {
              Write-Host ">> No module-level test execution required. Skipping." -ForegroundColor Green
              exit 0
          }
          
          $filterArg = ($testPatterns -join ",")
          Write-Host ">> Running tests for targeted modules: $filterArg" -ForegroundColor Yellow
          mvn test -Dtest="$filterArg"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
