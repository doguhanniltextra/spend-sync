name: Dynamic Backend Unit Tests

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  filter:
    name: Detect Changed Modules
    runs-on: self-hosted
    outputs:
      shared: ${{ steps.filter.outputs.shared }}
      modules: ${{ steps.filter.outputs.changes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for file changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared:
              - 'backend/pom.xml'
              - 'backend/src/main/java/com/enterprise/spendsync/shared/**'
              - 'backend/src/test/java/com/enterprise/spendsync/shared/**'
              - 'backend/src/test/java/com/enterprise/spendsync/architecture/**'
              - 'backend/src/main/java/com/enterprise/spendsync/core/**'
            vendorportal:
              - 'backend/src/**/vendorportal/**'
            purchasing:
              - 'backend/src/**/purchasing/**'
            requisition:
              - 'backend/src/**/requisition/**'
            budget:
              - 'backend/src/**/budget/**'
            matching:
              - 'backend/src/**/matching/**'
            payment:
              - 'backend/src/**/payment/**'
            receiving:
              - 'backend/src/**/receiving/**'
            catalog:
              - 'backend/src/**/catalog/**'
            intelligence:
              - 'backend/src/**/intelligence/**'
            analytics:
              - 'backend/src/**/analytics/**'
            audit:
              - 'backend/src/**/audit/**'
            notification:
              - 'backend/src/**/notification/**'

  test:
    name: Run Targeted Tests
    needs: filter
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Execute Targeted Tests
        shell: bash
        working-directory: ./backend
        run: |
          echo "Running unit tests for backend..."
          mvn test -Dtest="!*ContainerTest"
