name: Infrastructure Automation (Terraform)

on:
  pull_request:
    branches: [main]
    paths:
      - 'infra/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        type: choice
        options:
          - dev
          - prod
        default: 'dev'
        required: true
      apply_changes:
        description: 'Apply Terraform changes to AWS environment?'
        type: boolean
        required: true
        default: false

concurrency:
  group: terraform-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  terraform:
    name: Terraform (${{ inputs.environment || 'dev' }})
    runs-on: self-hosted
    defaults:
      run:
        working-directory: infra/envs/${{ inputs.environment || 'dev' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Configure AWS CLI Profile for Terraform
        run: |
          mkdir -p ~/.aws
          cat <<EOF > ~/.aws/credentials
          [spendsync]
          aws_access_key_id = ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key = ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          EOF
          cat <<EOF > ~/.aws/config
          [spendsync]
          region = ${{ vars.AWS_REGION }}
          output = json
          EOF

      - name: Terraform Format Check
        run: terraform fmt -check -recursive ../..

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -var-file=${{ inputs.environment || 'dev' }}.tfvars -out=${{ inputs.environment || 'dev' }}.tfplan

      - name: Comment Plan on Pull Request
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const output = `#### Terraform Format & Style 🖌 \`success\`
            #### Terraform Initialization ⚙️ \`success\`
            #### Terraform Validation 🤖 \`success\`
            #### Terraform Plan 📖 \`success\`

            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: Terraform Apply (Explicit Confirmation Only)
        if: github.event_name == 'workflow_dispatch' && inputs.apply_changes == true
        run: terraform apply -auto-approve ${{ inputs.environment || 'dev' }}.tfplan

