name: Security & Vulnerability Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  secret-scan:
    name: Secret Leak Detection
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        shell: powershell
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $gitleaksVer = "8.24.0"
          $url = "https://github.com/gitleaks/gitleaks/releases/download/v$gitleaksVer/gitleaks_${gitleaksVer}_windows_x64.zip"
          $zipPath = "$env:TEMP\gitleaks.zip"
          $destDir = "$env:TEMP\gitleaks_bin"

          if (!(Test-Path "$destDir\gitleaks.exe")) {
              Invoke-WebRequest -Uri $url -OutFile $zipPath -UseBasicParsing
              Expand-Archive -Path $zipPath -DestinationPath $destDir -Force
          }

          & "$destDir\gitleaks.exe" detect --source . --verbose --no-git --config .gitleaks.toml --gitleaks-ignore-path .gitleaksignore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  dependency-scan:
    name: Dependency Vulnerability Audit
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan Dependencies with Trivy
        shell: powershell
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $trivyVer = "0.59.1"
          $url = "https://github.com/aquasecurity/trivy/releases/download/v$trivyVer/trivy_${trivyVer}_windows-64bit.zip"
          $zipPath = "$env:TEMP\trivy.zip"
          $destDir = "$env:TEMP\trivy_bin"

          if (!(Test-Path "$destDir\trivy.exe")) {
              Invoke-WebRequest -Uri $url -OutFile $zipPath -UseBasicParsing
              Expand-Archive -Path $zipPath -DestinationPath $destDir -Force
          }

          & "$destDir\trivy.exe" fs --scanners vuln --severity HIGH,CRITICAL --format table .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
