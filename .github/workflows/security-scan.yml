name: Security & Secret Leak Detection

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Gitleaks Secret Leak Detection
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Detection
        shell: bash
        run: |
          echo "🔍 Scanning git history and repository for leaked secrets and credentials..."
          docker run --rm -v "$GITHUB_WORKSPACE:/path" zricethezav/gitleaks:latest detect \
            --source="/path" \
            --verbose \
            --config="/path/.gitleaks.toml"
          echo "✅ Gitleaks scan passed. No exposed secrets detected."
