name: Security & Vulnerability Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  secret-scan:
    name: Secret Leak Detection
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        shell: pwsh
        run: |
          $gitleaksVer = "8.24.0"
          $url = "https://github.com/gitleaks/gitleaks/releases/download/v$gitleaksVer/gitleaks_${gitleaksVer}_windows_x64.zip"
          $zipPath = "$env:TEMP\gitleaks.zip"
          $destDir = "$env:TEMP\gitleaks_bin"

          if (!(Test-Path "$destDir\gitleaks.exe")) {
              Invoke-WebRequest -Uri $url -OutFile $zipPath
              Expand-Archive -Path $zipPath -DestinationPath $destDir -Force
          }

          & "$destDir\gitleaks.exe" detect --source . --verbose --no-git
          exit $LASTEXITCODE

  dependency-scan:
    name: Dependency Vulnerability Audit
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Audit Frontend Dependencies
        shell: pwsh
        working-directory: ./frontend
        run: |
          npm audit --audit-level=high --omit=dev
          exit $LASTEXITCODE

      - name: Audit Backend Dependencies
        shell: pwsh
        working-directory: ./backend
        run: |
          mvn org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=8 -Dformat=HTML
          exit $LASTEXITCODE
