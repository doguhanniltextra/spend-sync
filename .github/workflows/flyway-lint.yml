name: Flyway Migration Lint

on:
  push:
    branches: [main]
    paths:
      - 'backend/src/main/resources/db/migration/**'
  pull_request:
    branches: [main]
    paths:
      - 'backend/src/main/resources/db/migration/**'
  workflow_dispatch:

jobs:
  lint-migrations:
    name: Validate Migration Scripts
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate SQL Naming and Invariants
        shell: bash
        working-directory: ./backend/src/main/resources/db/migration
        run: |
          set -e
          echo "Validating Flyway migration files..."
          
          HAS_ERRORS=0
          
          for file in V*.sql; do
            [ -e "$file" ] || continue
            
            if [[ ! "$file" =~ ^V[0-9]+(_[0-9]+)*__[a-zA-Z0-9_]+\.sql$ ]]; then
              echo "::error::Invalid migration filename format: $file. Must match 'V<version>__<description>.sql'."
              HAS_ERRORS=1
            fi
            
            if [ ! -s "$file" ]; then
              echo "::error::Migration file is empty: $file"
              HAS_ERRORS=1
            fi
          done
          
          if [ $HAS_ERRORS -ne 0 ]; then
            echo "Flyway lint validation failed!"
            exit 1
          fi
          
          echo "All Flyway migration scripts passed validation successfully."
